<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba de integración Mercado Pago</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 2rem; }
    input, button { padding: 0.5rem; font-size: 1rem; }
    .result { margin-top: 1rem; word-break: break-all; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Crear pago con Mercado Pago</h1>
  <label for="amount">Monto (USD): </label>
  <input type="number" id="amount" min="0.01" step="0.01" placeholder="10.00" />
  <button id="payBtn">Crear pago</button>
  <div class="result" id="result"></div>

  <script>
    const payBtn = document.getElementById('payBtn');
    const resultDiv = document.getElementById('result');
    const PORT = 3001; // matches server/.env

    payBtn.addEventListener('click', async () => {
      const amount = parseFloat(document.getElementById('amount').value);
      resultDiv.textContent = '';
      if (!amount || amount <= 0) {
        resultDiv.innerHTML = '<span class="error">Introduce un monto válido.</span>';
        return;
      }
      try {
        const response = await fetch(`http://localhost:${PORT}/api/payments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, description: 'Test payment' }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Error al crear el pago');
        }
        // Show payment link (init_point) and ID
        resultDiv.innerHTML = `
          <p><strong>ID de preferencia:</strong> ${data.id}</p>
          <p><a href="${data.init_point}" target="_blank">Abrir checkout de Mercado Pago</a></p>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<span class="error">${err.message}</span>`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
